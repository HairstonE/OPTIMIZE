[package]
name = "optimize"
version = "0.1.0"
edition = "2021"

# Pitfall #1 (version skew): do NOT add `sqlparser` as a direct dependency.
# Use `datafusion::sql::sqlparser` — DataFusion re-exports the exact version
# its own frontend links.
[dependencies]
datafusion = "54"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Oracle #2 (DuckDB) is the system CLI, not a crate: the bundled crate's
# C++ doesn't build on older Xcode toolchains and costs 30+ min when it
# does. Install: `brew install duckdb` or https://duckdb.org/install —
# tests/common/mod.rs finds it on PATH, at ~/.duckdb/cli/latest/, or via
# OPTIMIZE_DUCKDB=<path>.
[dev-dependencies]
insta = "1"                                        # EXPLAIN snapshot gates

[lib]
name = "optimize"
path = "src/lib.rs"

[[bin]]
name = "optimize"
path = "src/main.rs"

# duckdb's bundled C++ build is slow in debug; always optimize deps a bit.
[profile.dev.package."*"]
opt-level = 1
