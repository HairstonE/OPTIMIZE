# Corpus manifest. tier = highest optimizer sophistication REQUIRED to
# execute the query in reasonable time:
#
#   tier 0 — feasible even fully unoptimized: single table, 2-way joins
#            (a 5000×10000 comma-join cross product is slow-on-purpose but
#            finishes), or explicit INNER JOIN chains (the untouched
#            physical planner still picks hash joins for those).
#   tier 1 — 3+-way comma-joins: unoptimized these are literal 10^10+-row
#            cross products and will never finish. They execute from P1
#            (pushdown) onward.
#
# The differential pairs (optimizer × query) where
# query.tier <= opt::execution_tier(optimizer). EXPLAIN snapshots ignore
# tiers — every optimizer renders every query from day one.

